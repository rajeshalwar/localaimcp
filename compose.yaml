# Two networks are the load-bearing design element.
#
#   netint  internal: true  -- no route off-box. Containers on it can talk to
#                              each other freely; none of them can reach the
#                              internet. Ollama and the agent live here only.
#   netext  ordinary bridge -- ONLY the appliance is attached, so the tool
#                              server is the single egress path, by topology
#                              rather than by convention.

# Pinned so network, volume and image names do not depend on the folder the
# repo was cloned into (a GitHub zip unpacks to localaimcp-main). The Makefile
# and the Quadlet units rely on these names.
name: localaimcp

networks:
  netint:
    internal: true
  netext: {}

volumes:
  pgdata: {}
  ollama-models: {}

services:
  appliance:
    build:
      context: .
      dockerfile: containers/appliance.Containerfile
    container_name: appliance
    networks: [netint, netext]
    ports:
      # Loopback only: MCP clients on this machine can connect, the conference
      # Wi-Fi cannot. The server has no auth. Not an egress path either way.
      - "127.0.0.1:8000:8000"
    volumes:
      - pgdata:/var/lib/pgsql
    environment:
      NREL_API_KEY: ${NREL_API_KEY:-}
      POSTGRES_USER: ${POSTGRES_USER:-solar}
      POSTGRES_DB: ${POSTGRES_DB:-solar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
      POSTGRES_HOST: 127.0.0.1
      TOOL_PROFILE: ${TOOL_PROFILE:-all}
      REPLAY_ONLY: ${REPLAY_ONLY:-false}
      DEFAULT_RATE_PER_KWH: ${DEFAULT_RATE_PER_KWH:-0.15}
      SESSION_ID: ${SESSION_ID:-}
    healthcheck:
      # A bare GET to a Streamable HTTP endpoint answers 406 (it wants specific
      # Accept headers). Any HTTP status < 500 proves the server is listening.
      test: ["CMD", "python3", "-c",
             "import urllib.request as u,urllib.error as e,sys;\ntry: c=u.urlopen('http://127.0.0.1:8000/mcp',timeout=3).status\nexcept e.HTTPError as x: c=x.code\nexcept Exception: sys.exit(1)\nsys.exit(0 if c<500 else 1)"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 40s

  ollama:
    image: docker.io/ollama/ollama:0.34.0
    container_name: ollama
    networks: [netint]        # <- internal only. The model has no route out.
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
      OLLAMA_HOST: 0.0.0.0:11434

  # One-shot, network-attached, thrown away. The only container that is ever
  # allowed to download the model; the one that runs it cannot reach the net.
  model-pull:
    image: docker.io/ollama/ollama:0.34.0
    profiles: [setup]
    networks: [netext]
    volumes:
      - ollama-models:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve & 
        for i in $$(seq 1 30); do ollama list >/dev/null 2>&1 && break; sleep 1; done
        echo "pulling $${MODEL_NAME}…"
        ollama pull "$${MODEL_NAME}"
        ollama list
    environment:
      MODEL_NAME: ${MODEL_NAME:-qwen2.5:7b-instruct}

  agent:
    build:
      context: .
      dockerfile: containers/agent.Containerfile
    networks: [netint]        # <- the agent cannot reach the internet either
    depends_on:
      appliance:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      MCP_URL: http://appliance:8000/mcp
      MODEL_NAME: ${MODEL_NAME:-qwen2.5:7b-instruct}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-350}
    stdin_open: true
    tty: true
